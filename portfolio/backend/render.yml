services:
  - type: web
    name: portfolio-backend
    runtime: python
    region: oregon
    plan: starter
    rootDir: portfolio/backend
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false # cole a pooled connection string do Neon Console
      - key: TRUSTED_PROXY_HOPS
        value: "1" # Render, like Railway, sits behind a single edge proxy
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: JWT_REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      # --- secrets: set values in Render dashboard, do not commit them ---
      - key: JWT_SECRET_KEY
        sync: false
      - key: MFA_ENCRYPTION_KEY
        sync: false # MUST be the exact same value used on Railway, or
                     # every stored TOTP secret becomes undecryptable.
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: WHATSAPP_NUMBER
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false # e.g. https://yourdomain.com
      - key: ALLOWED_HOSTS
        sync: false # e.g. portfolio-backend.onrender.com,yourdomain.com