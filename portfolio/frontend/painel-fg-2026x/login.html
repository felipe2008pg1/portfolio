<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="icon" type="image/x-icon" href="../assets/img/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/img/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="../assets/img/icon-192.png">
  <link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
  <meta name="theme-color" content="#0F2942">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin — Login</title>

  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/reset.css">
  <link rel="stylesheet" href="../assets/css/variables.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="assets/css/admin.css">

  <script src="../assets/js/theme.js"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
  <div class="cursor-dot" id="cursorDot"></div>

  <div class="login-shell">
    <div class="login-topbar">
      <div class="lang-toggle" role="group" aria-label="Idioma / Language">
        <button type="button" data-lang="pt">PT</button>
        <button type="button" data-lang="en">EN</button>
      </div>
      <button type="button" class="theme-toggle" id="themeToggle" aria-label="Alternar tema" aria-pressed="false">
        <span class="theme-toggle-icon" aria-hidden="true">☾</span>
      </button>
    </div>

    <div class="login-card">
      <div class="login-logo">felipe<span style="color: var(--color-teal);">.dev</span> / admin</div>
      <h1 class="login-title" id="loginTitle" data-i18n="admin.login.title">Entrar</h1>

      <div class="admin-alert" id="loginAlert" role="alert"></div>

      <form id="loginForm" novalidate>
        <div class="form-field">
          <label for="username" data-i18n="admin.login.username">Usuário</label>
          <input type="text" id="username" name="username" required maxlength="64" autocomplete="username">
        </div>

        <div class="form-field">
          <label for="password" data-i18n="admin.login.password">Senha</label>
          <input type="password" id="password" name="password" required maxlength="256" autocomplete="current-password">
        </div>

        <div class="cf-turnstile" data-sitekey="0x4AAAAAAD2-bMzcMMaQWBgk" data-theme="auto"></div>

        <button type="submit" class="btn btn-primary" id="loginSubmit" data-i18n="admin.login.submit">Entrar</button>
      </form>

      <form id="mfaForm" novalidate style="display:none;">
        <div class="form-field">
          <label for="mfaCode">Código do autenticador (ou código de backup)</label>
          <input type="text" id="mfaCode" name="mfaCode" required maxlength="20" autocomplete="one-time-code" placeholder="123456">
        </div>

        <button type="submit" class="btn btn-primary" id="mfaSubmit">Verificar</button>
      </form>
    </div>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/i18n.js"></script>
  <script src="assets/js/admin-api.js"></script>
  <script src="assets/js/login.js"></script>
  <script src="../assets/js/custom-cursor.js"></script>
</body>
</html>
